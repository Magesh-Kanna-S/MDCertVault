<!-- Replace this SVG with your organization's logo.
     Recommended: 200×60 px, single-color or two-color, transparent background. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3f00"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
  </defs>
  <rect x="2" y="10" width="40" height="40" rx="10" fill="url(#logoGrad)"/>
  <text x="22" y="38" text-anchor="middle"
        font-family="Georgia, serif" font-size="22" font-weight="700" fill="white">Y</text>
  <text x="52" y="38" font-family="Georgia, serif" font-size="18" font-weight="600" fill="#5f2f00">Your Org</text>
</svg>
